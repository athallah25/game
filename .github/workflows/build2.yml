name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Create the Android project
      # --------------------------------------------------
      - name: Write project files
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'CitySim'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          mkdir -p app

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.city.sim'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.city.sim"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          mkdir -p app/src/main/java/com/city/sim

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:label="City Sim"
                  android:theme="@android:style/Theme.Material.NoActionBar.Fullscreen">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      # --------------------------------------------------
      # Java source
      #
      # IMPORTANT:
      # Put your complete MainActivity.java in:
      #
      # app/src/main/java/com/city/sim/MainActivity.java
      #
      # If your Java code is already in the repository,
      # this workflow will use it.
      # --------------------------------------------------

      - name: Check source files
        shell: bash
        run: |
          echo "Checking Android project..."

          if [ ! -f "app/src/main/java/com/city/sim/MainActivity.java" ]; then
            echo "ERROR: MainActivity.java was not found."
            echo "Put your complete Java source at:"
            echo "app/src/main/java/com/city/sim/MainActivity.java"
            exit 1
          fi

          echo "MainActivity.java found."

      # --------------------------------------------------
      # Java / Android build environment
      # --------------------------------------------------

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # --------------------------------------------------
      # Build APK
      # --------------------------------------------------

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace

      # --------------------------------------------------
      # Show generated APK
      # --------------------------------------------------

      - name: List APK files
        run: |
          find app/build/outputs -type f -name "*.apk" -print

      # --------------------------------------------------
      # Upload APK to GitHub
      # --------------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CitySim-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
